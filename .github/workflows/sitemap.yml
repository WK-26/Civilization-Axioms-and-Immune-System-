name: Generate single sitemap.xml

on:
  push:
    branches: [ main ]         # 如默认分支是 master 就改为 master
  workflow_dispatch:            # 手动触发
  schedule:
    - cron: "0 3 * * 1"         # 每周一 03:00 UTC 自动刷新

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate sitemap.xml (HTML + PDF, URL-encoded, lastmod)
        run: |
          python3 - << 'PY'
          import os
          from datetime import datetime, timezone
          from urllib.parse import quote

          # ===== 可按需修改 =====
          BASE_URL = "https://wk-26.github.io/Civilization-Axioms-and-Immune-System-/"
          INCLUDE_EXT = {".html", ".pdf"}
          EXCLUDE_DIRS = {".git", ".github", "node_modules", "vendor", ".venv", "__pycache__"}
          EXCLUDE_NAMES = {"404.html"}
          # ======================

          def iso_utc(ts=None):
            dt = datetime.now(timezone.utc) if ts is None else datetime.fromtimestamp(ts, tz=timezone.utc)
            return dt.strftime("%Y-%m-%dT%H:%M:%S+00:00")

          def to_url(rel):
            # URL 编码路径，保留常见安全字符和斜杠
            return BASE_URL + quote(rel, safe="/:@-._~!$&'()*+,;=")

          def priority_for(ext):   return "0.8" if ext == ".html" else "0.5"
          def changefreq_for(ext): return "monthly" if ext == ".html" else "yearly"

          # 收集文件
          paths = []
          for root, dirs, files in os.walk("."):
            dirs[:] = [d for d in dirs if d not in EXCLUDE_DIRS and not d.startswith(".git")]
            for f in files:
              ext = os.path.splitext(f)[1].lower()
              if ext in INCLUDE_EXT and f not in EXCLUDE_NAMES:
                rel = os.path.relpath(os.path.join(root, f), ".").replace("\\", "/")
                parts = rel.split("/")
                if any(p.startswith("_") for p in parts[:-1]):  # 跳过 _layouts/_includes 等
                  continue
                paths.append(rel)

          paths = sorted(dict.fromkeys(paths))

          with open("sitemap.xml", "w", encoding="utf-8") as out:
            out.write('<?xml version="1.0" encoding="UTF-8"?>\n')
            out.write('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n')

            # 首页
            out.write("  <url>\n")
            out.write(f"    <loc>{BASE_URL}</loc>\n")
            out.write(f"    <lastmod>{iso_utc()}</lastmod>\n")
            out.write( "    <priority>1.0</priority>\n")
            out.write( "    <changefreq>weekly</changefreq>\n")
            out.write("  </url>\n")

            for rel in paths:
              ext = os.path.splitext(rel)[1].lower()
              url = to_url(rel)
              try:
                mtime = os.path.getmtime(rel)
              except FileNotFoundError:
                mtime = None
              out.write("  <url>\n")
              out.write(f"    <loc>{url}</loc>\n")
              out.write(f"    <lastmod>{iso_utc(mtime)}</lastmod>\n")
              out.write(f"    <priority>{priority_for(ext)}</priority>\n")
              out.write(f"    <changefreq>{changefreq_for(ext)}</changefreq>\n")
              out.write("  </url>\n")

            out.write("</urlset>\n")

          # 维护 robots.txt：声明唯一 Sitemap
          robots_line = f"Sitemap: {BASE_URL}sitemap.xml\n"
          if os.path.exists("robots.txt"):
            with open("robots.txt", "r+", encoding="utf-8") as f:
              content = f.read()
              if "Sitemap:" not in content:
                if not content.endswith("\n"):
                  content += "\n"
                content += robots_line
                f.seek(0); f.truncate(0); f.write(content)
          else:
            with open("robots.txt", "w", encoding="utf-8") as f:
              f.write("User-agent: *\nAllow: /\n" + robots_line)
          PY

      - name: Remove legacy sitemap artifacts
        run: |
          git rm -f sitemap_index.xml sitemap-*.xml 2>/dev/null || true

      - name: Commit and push sitemap.xml
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          git commit -m "Generate single sitemap.xml" || echo "No changes"
          git push
