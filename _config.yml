# 站点基本信息
title: "Civilization Axioms and Immune System"
description: "A collection of writings on civilization axioms, immune systems, and the future of humanity."
url: "https://wk-26.github.io" # 你的 GitHub Pages 根域名
baseurl: "/Civilization-Axioms-and-Immune-System-" # 仓库名

# Markdown 配置
markdown: kramdown
theme: minima   # 你也可以换别的 Jekyll 主题，比如 jekyll-theme-cayman

# 插件配置
plugins:
  - jekyll-sitemap   # 自动生成 sitemap.xml
  - jekyll-feed      # 自动生成 RSS（可选）

# 文章目录
collections:
  posts:
    output: true

# 排除不需要出现在 sitemap 的文件
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# 其他可选设置
timezone: "UTC"