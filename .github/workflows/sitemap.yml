name: Generate sitemap.xml

on:
  push:
    branches:
      - main   # 如果你的默认分支是 master，就改成 master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate sitemap.xml
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          # 添加首页
          echo "  <url><loc>https://wk-26.github.io/Civilization-Axioms-and-Immune-System-/</loc></url>" >> sitemap.xml

          # 遍历仓库所有 html 和 pdf 文件
          for file in $(find . -type f \( -name "*.html" -o -name "*.pdf" \)); do
            # 去掉前导 ./ 
            clean=${file#./}
            echo "  <url><loc>https://wk-26.github.io/Civilization-Axioms-and-Immune-System-/$clean</loc></url>" >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      - name: Commit and push sitemap.xml
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add sitemap.xml
          git commit -m "Auto-update sitemap.xml" || echo "No changes"
          git push
